spring:
  datasource:
    url: jdbc:h2:mem:orchestrator_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

clients:
  member-service:
    base-url: http://localhost:8081
  catalog-service:
    base-url: http://localhost:8082
  borrowing-service:
    base-url: http://localhost:8083

